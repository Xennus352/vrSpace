[project]
name = "spacex-gesture-earth"
version = "0.1.0"
description = "Gesture-controlled 3D Earth renderer - pure Python with PyOpenGL + pygame"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5.0",
    "PyOpenGL>=3.1.7",
    "PyOpenGL-accelerate>=3.1.7",
    "mediapipe==0.10.14",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pyttsx3>=2.90",
]

[project.scripts]
spacex = "main:main"

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "renderer", "gesture_detector", "ui_overlay", "glass_panel", "glove_hand", "interaction", "vr_head", "vr_scene", "hologram"]

[dependency-groups]
dev = []
